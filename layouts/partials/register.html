<!-- Registering section -->
<section class="signup-strip">
  <div class="signup-inner">

    <h2>Start Your Long-Run Journey</h2>
    <p class="signup-subtitle">
      Download our 10-Year Running Planner & PDF Guide
    </p>

    <form method="POST" action="https://example.com/your-form-endpoint">

      <div class="signup-row">
        <input
          type="text"
          name="first_name"
          placeholder="Enter Your First Name"
          required
        >

        <input
          type="text"
          name="last_name"
          placeholder="Enter Your Last Name"
          required
        >
      </div>

      <div class="signup-row">
        <input
          type="email"
          name="email"
          placeholder="Your Email Address"
          required
        >
      </div>

      <div class="signup-row signup-button-row">
        <button type="submit">
          Get the Guide
        </button>
      </div>

    </form>
  </div>
</section>
